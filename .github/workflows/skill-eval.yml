name: Skill Eval

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'evals/**'
      - '.claude-plugin/**'
      - '.github/workflows/skill-eval.yml'
  workflow_dispatch:
    inputs:
      runs:
        description: 'Runs per case'
        default: '2'

concurrency:
  group: skill-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  # Pin both models so a model rollout is never mistaken for a skill regression.
  EVAL_MODEL: claude-sonnet-5-5
  JUDGE_MODEL: claude-haiku-5-5
  RUNS: ${{ github.event.inputs.runs || '2' }}

jobs:
  grader-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Regex graders match written code and ignore skill text
        run: node evals/scripts/check-regex.mjs evals

  skill-eval:
    needs: grader-check
    # Fork PRs have no access to the API key; skip rather than fail.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # The base checkout gets the head's evals/, so both sides answer the same
      # questions and the only variable is the skill text.
      - name: Prepare base checkout
        run: |
          base_ref="${{ github.event.pull_request.base.ref || 'main' }}"
          git worktree add ../base "origin/${base_ref}"
          rm -rf ../base/evals
          cp -R evals ../base/evals

      - name: Eval head
        run: |
          claude plugin eval . --trust-plugin --scaffold --allow-tools Write Edit \
            --ablation none --runs "$RUNS" -j 4 --threshold 0 \
            --model "$EVAL_MODEL" --judge-model "$JUDGE_MODEL" \
            --max-cost-usd 40 --no-publish --json head.json --report head.html

      - name: Eval base
        run: |
          claude plugin eval ../base --trust-plugin --scaffold --allow-tools Write Edit \
            --ablation none --runs "$RUNS" -j 4 --threshold 0 \
            --model "$EVAL_MODEL" --judge-model "$JUDGE_MODEL" \
            --max-cost-usd 40 --no-publish --json base.json --report base.html

      - name: Compare
        id: compare
        run: node evals/scripts/compare.mjs base.json head.json --tolerance 0.1 --markdown summary.md

      - name: Publish summary
        if: always() && hashFiles('summary.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file summary.md --edit-last \
              || gh pr comment "${{ github.event.pull_request.number }}" --body-file summary.md
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skill-eval
          path: |
            head.json
            base.json
            head.html
            base.html
            summary.md
          if-no-files-found: ignore
